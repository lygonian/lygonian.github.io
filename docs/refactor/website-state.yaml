reconciliation_items:
  - id: REC-001
    conflict: "DESIGN.md names index.html as binding design reference; current mandate says existing code is not design authority."
    status: reconciled_via_WRO-DEC-001
  - id: REC-002
    conflict: "Project instructions require mobile checks but postpone tablet/smartphone work; current program includes full responsive review."
    status: reconciled_audit_only_writes_deferred
  - id: REC-003
    conflict: "The documented exclusive ./veroeffentlichen.sh publication command is absent from worktree and HEAD."
    status: open_blocker_for_publication
  - id: REC-004
    conflict: "Eight category color-mix() washes are consistent, but their UI-versus-artwork contract classification is not explicit."
    status: reconciled_seven_artwork_one_card_identity_decoration
  - id: REC-005
    conflict: "The homepage research CTA targets ki_basics.html although text and IA identify research under Über mich."
    status: resolved_verified_WRO-011
  - id: REC-006
    conflict: "Nine raster images lack width, height, and lazy loading required by project instructions."
    status: resolved_verified_WRO-011
  - id: REC-007
    conflict: "Sixteen descendant pages mark a parent navigation route with aria-current=page instead of an ancestor-location state."
    status: resolved_verified_WRO-011
  - id: REC-008
    conflict: "Inline text links rely on color although Interaction versus surrounding text is only about 1.19:1."
    status: resolved_verified_WRO-011
  - id: REC-009
    conflict: "Research pages reuse the profile tree world instead of the distinct microscopic world required by DESIGN.md."
    status: resolved_verified_WRO-012
  - id: REC-010
    conflict: "The homepage connector is permanently multicolor, omits Private Projects, and is not locally anchored to semantic activation regions."
    status: resolved_verified_WRO-012
  - id: REC-011
    conflict: "All subpages share one generic stretched biome rather than visibly deepening their documented category motifs."
    status: resolved_verified_WRO-012
  - id: REC-012
    conflict: "At max-width 780px, expertise focus still applies a 3px lift even though accepted focus behavior is motionless."
