  - {id: spacing, owner: foundation-systems, parallel_policy: serialized_if_style_css}
  - {id: containers, owner: foundation-systems, parallel_policy: serialized_if_style_css}
  - {id: layout, owner: layout-responsive, parallel_policy: serialized_if_style_css_or_measured_dom}
  - {id: responsive, owner: layout-responsive, parallel_policy: serialized_if_style_css_or_shared_shell}
  - {id: components_surface, owner: components-interaction, parallel_policy: primary_writer_per_component}
  - {id: components_card, owner: components-interaction, parallel_policy: primary_writer_per_component}
  - {id: components_button, owner: components-interaction, parallel_policy: primary_writer_per_component}
  - {id: components_navigation, owner: components-interaction, parallel_policy: serialized_all_23_pages}
