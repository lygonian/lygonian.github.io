schema_version: 1
updated_at: "2026-08-15"
direction: "from constraining or consumed dependency to affected consumer"
scheduling_semantics:
  hard_edge_types: [consumes, constrains, structural_dependency, visual_dependency, semantic_dependency]
  review_dependency: "Review gate only; excluded from topological contract scheduling."
  cleanup_after_stabilization: "Deferred ordering edge; excluded until upstream contracts are accepted."
  partial_ready_scope: "A hard edge may be scheduled against a partial contract only for an explicitly matching ready_scope subset; touching blocked_scope or an unmatched dependency subset blocks the task."
evidence_basis:
  html_pages: 23
  shared_css: assets/css/style.css
  shared_javascript: assets/js/atlas.js
  artwork_sources: [assets/css/style.css, index.html, assets/img/subpage-biome.svg, assets/js/atlas.js]

