parallel_groups:
  discovery:
    policy: parallel_read_only
    groups:
      - [design_tokens, typography, color_ui, spacing, containers]
      - [layout, responsive, layers]
      - [components_surface, components_card, components_button, interaction, motion]
      - [color_artwork, visual_effects, background_artwork, icons_symbols]
      - [navigation, information_architecture, content_roles, html_semantics, media_image, accessibility]
      - [css_architecture, javascript_architecture, dead_code_cleanup]
  contract_synthesis:
    policy: parallel_proposals_single_orchestrator_write
    coordination: "Groups draft in parallel; hard dependencies are resolved inside each proposal before acceptance."
    groups:
      - [design_tokens, typography, color_ui, spacing, containers]
      - [layout, responsive, layers]
      - [components_surface, components_card, components_button, components_navigation, interaction, motion]
      - [color_artwork, visual_effects, background_artwork, icons_symbols]
      - [information_architecture, content_roles, navigation, html_semantics, media_image, accessibility]
  implementation:
    policy: explicit_leases_only
    safe_examples:
      - "Disjoint HTML detail-page media metadata tasks without shared shell changes."
      - "Documentation-only task parallel to a read-only review."
    serialized_examples:
      - "Any two tasks writing assets/css/style.css."
      - "Any task pairing index.html artwork with assets/js/atlas.js geometry."
      - "Any shared Header/Nav/Footer change across 23 pages."

conflict_zones:
  - path: assets/css/style.css
    domains: [foundation, layout, responsive, components, interaction, effects, layers, artwork, cleanup]
    policy: one_primary_writer
  - path: index.html
    domains: [content_ia, layout, artwork, accessibility, javascript_hooks]
    policy: one_primary_writer
  - path: assets/js/atlas.js
    domains: [interaction, motion, layout_measurement, artwork_paths, cleanup]
    policy: one_primary_writer
  - path_pattern: "**/*.html:shared-shell"
    domains: [navigation, information_architecture, accessibility]
    policy: global_lease_all_23_pages
