<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">Optimierter Farbverlauf des Hauptstrahls</title>
  <desc id="desc">Ein weich leuchtender organischer Strahl geht auf dunklem Grund von Automation-Grün über Datenanalyse-Blau in das Violett der privaten Projekte über.</desc>

  <defs>
    <!-- Exakte Rubrikfarben bleiben die Anker; Zwischenstopps glätten nur den räumlichen Übergang. -->
    <linearGradient id="hauptstrahl-farbe" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1710" y2="0" color-interpolation="sRGB">
      <stop offset="0" stop-color="#54C596"/>
      <stop offset="21%" stop-color="#54C596"/>
      <stop offset="34%" stop-color="#57C3B3"/>
      <stop offset="46%" stop-color="#5CC0E6"/>
      <stop offset="59%" stop-color="#5CC0E6"/>
      <stop offset="73%" stop-color="#6B9FCB"/>
      <stop offset="86%" stop-color="#7A88B2"/>
      <stop offset="100%" stop-color="#7A88B2"/>
    </linearGradient>

    <linearGradient id="hauptstrahl-kern" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1710" y2="0" color-interpolation="sRGB">
      <stop offset="0" stop-color="#A8E2C8"/>
      <stop offset="21%" stop-color="#86D6B4"/>
      <stop offset="46%" stop-color="#A8DDF0"/>
      <stop offset="59%" stop-color="#88D0EB"/>
      <stop offset="86%" stop-color="#A5ADCB"/>
      <stop offset="100%" stop-color="#8F9BC0"/>
    </linearGradient>

    <linearGradient id="enden-ausblendung" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1800" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="5%" stop-color="white" stop-opacity="1"/>
      <stop offset="95%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <mask id="strahl-maske" maskUnits="userSpaceOnUse" x="0" y="0" width="1800" height="600">
      <rect width="1800" height="600" fill="url(#enden-ausblendung)"/>
    </mask>

    <filter id="weite-glut" filterUnits="userSpaceOnUse" x="0" y="0" width="1800" height="600" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="nahe-glut" filterUnits="userSpaceOnUse" x="0" y="0" width="1800" height="600" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="weiche-kante" filterUnits="userSpaceOnUse" x="0" y="0" width="1800" height="600" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Website-Kontext, keine neue UI-Farbe. -->
  <rect width="1800" height="600" fill="#050908"/>

  <!-- Weite Atmosphäre: ruhig genug für den dunklen Seitenraum. -->
  <path d="M 40 350 C 390 314, 645 326, 900 300 S 1405 242, 1760 278"
        fill="none" stroke="url(#hauptstrahl-farbe)" stroke-width="210" stroke-linecap="round"
        opacity="0.18" mask="url(#strahl-maske)" filter="url(#weite-glut)"/>

  <!-- Farbtragender Körper. -->
  <path d="M 40 350 C 390 314, 645 326, 900 300 S 1405 242, 1760 278"
        fill="none" stroke="url(#hauptstrahl-farbe)" stroke-width="108" stroke-linecap="round"
        opacity="0.52" mask="url(#strahl-maske)" filter="url(#nahe-glut)"/>
  <path d="M 40 350 C 390 314, 645 326, 900 300 S 1405 242, 1760 278"
        fill="none" stroke="url(#hauptstrahl-farbe)" stroke-width="62" stroke-linecap="round"
        opacity="0.82" mask="url(#strahl-maske)" filter="url(#weiche-kante)"/>

  <!-- Schmaler Lichtkern hält den Strahl lebendig, ohne neonartig zu werden. -->
  <path d="M 40 350 C 390 314, 645 326, 900 300 S 1405 242, 1760 278"
        fill="none" stroke="url(#hauptstrahl-kern)" stroke-width="13" stroke-linecap="round"
        opacity="0.7" mask="url(#strahl-maske)" filter="url(#weiche-kante)"/>
  <path d="M 40 350 C 390 314, 645 326, 900 300 S 1405 242, 1760 278"
        fill="none" stroke="url(#hauptstrahl-kern)" stroke-width="3" stroke-linecap="round"
        opacity="0.76" mask="url(#strahl-maske)"/>
</svg>
