<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc"><title id="title">Das Portfolio-Agentensystem: Facharbeit mit Rückkopplung</title><desc id="desc">Conductor wählt aus sieben Fachrollen. Investigator, Case Strategist, Cartographer, Architect, Weaver und Scribe stimmen fachliche Fragen direkt ab; gezeigt sind ausgewählte vorgesehene Beziehungen. Beiträge fließen zurück zur Integration. Sentinel prüft lesend, Befunde gehen an zuständige Fachrollen. Nacharbeit und erneute Prüfung führen zum Gesamturteil des Hauptthreads.</desc><style>text{font-family:Arial,sans-serif;fill:#E8EDEA;font-size:21px}.small{font-size:16px;fill:#B7C1BD}.meta{font-size:14px;fill:#B7C1BD}.node{fill:#141917;fill-opacity:.85;stroke:#69706D;stroke-width:1.3}.flow{fill:none;stroke:#CDD0CE;stroke-width:1.6;marker-end:url(#arrow)}.consult{fill:none;stroke:#54C596;stroke-width:1.5;marker-start:url(#both);marker-end:url(#both)}.return{fill:none;stroke:#7A88B2;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#back)}.context{fill:#54C596}.review{fill:#7A88B2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#CDD0CE"/></marker><marker id="both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#54C596"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#7A88B2"/></marker></defs><text class="meta" x="30" y="28">SAMET · ZIEL, QUELLEN UND DESIGN</text><path class="flow" d="M351 22H412"/><rect class="node" x="415" y="0" width="440" height="87" rx="17"/><text x="435" y="32">Conductor · Hauptthread</text><text class="small" x="435" y="58">Auswahl, Auftrag, Integration und Gesamturteil</text><path class="flow" d="M445 87V118H1