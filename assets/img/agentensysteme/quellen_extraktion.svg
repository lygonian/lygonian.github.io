<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc"><title id="title">Quellen- und Erfahrungssystem: spezialisierte Modellaufgaben, Prüfungen und persönliche Korrektur</title><desc id="desc">Originale werden in adressierbare Kontextpakete überführt. Ein Scheduler verteilt Aufträge an ein Extraktionsmodell und speichert Arbeitsstände. Struktur- und Referenzprüfung geben ungültige Antworten zurück. Ein stärkeres Modell prüft Stichproben und verdichtet mit Bezug auf Originalsegmente. Globale Zusammenführung erhält Zuordnungen und Quellen. Persönliche Korrekturen aktualisieren die Wissens- und Erfahrungsgrundlage sowie ihre Ableitungen.</desc><style>text{font-family:Arial,sans-serif;fill:#E8EDEA;font-size:21px}.small{font-size:16px;fill:#B7C1BD}.meta{font-size:14px;fill:#B7C1BD}.node{fill:#141917;fill-opacity:.85;stroke:#69706D;stroke-width:1.3}.flow{fill:none;stroke:#CDD0CE;stroke-width:1.6;marker-end:url(#arrow)}.consult{fill:none;stroke:#54C596;stroke-width:1.5;marker-start:url(#both);marker-end:url(#both)}.return{fill:none;stroke:#7A88B2;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#back)}.context{fill:#54C596}.review{fill:#7A88B2}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#CDD0CE"/></marker><marker id="both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#54C596"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#7A88B2"/></marker></defs><text class="meta" x="25" y="25">QUELLENERSCHLIESSUNG</text><rect class="node" x="25" y="45" width="305" height="126" rx="17"/><text x="45" y="77">Unterschiedliche Originale</text><text class="small" x="45" y="103">Dokumente &amp; Tabellen</text><text class="small" x="45" y="125">Mailzusammenhänge &amp; Chats</text><text class="small" x="45" y="147">Projektmaterial</text><rect class="node" x="425" y="45" width="305" height="126" rx="17"/><text x="445" y="77">Adressierbare Pakete</text><text class="small" x="445" y="103">Quelle + Segment + Fundstelle</text><text class="small" x="445" y="125">Sprecher, Zeit und Quellenart</text><text class="small" x="445" y="147">Adapter erhalten den Kontext</text><path class="flow" d="M336 108H419"/><text class="small" x="775" y="80"> </text><rect class="node" x="810" y="45" width="285" height="126" rx="17"/><text x="830" y="77">Scheduler</text><text class="small" x="830" y="103">Aufträge gezielt zuteilen</text><text class="small" x="830" y="125">Versuche &amp; Status speichern</text><text class="small" x="830" y="147">Unterbrochene Arbeit fortsetzen</text><path class="flow" d="M736 108H804"/><path class="flow" d="M950 177V216H177V251"/><text class="meta" x="25" y="204">MODELLGESTÜTZTE AUFGABEN · FRISCHER KONTEXT JE QUELLENAUFTRAG</text><rect class="node" x="25" y="255" width="305" height="126" rx="17"/><text x="45" y="287">Triage &amp; Extraktion</text><text class="small" x="45" y="313">Kleineres Modell</text><text class="small" x="45" y="335">Aussage, Beitrag, Zeitstatus</text><text class="small" x="45" y="357">JSON nach festem Schema</text><rect class="node" x="425" y="255" width="305" height="126" rx="17"/><text x="445" y="287">Struktur &amp; Referenzen</text><text class="small" x="445" y="313">Regeln prüfen Identität, Felder</text><text class="small" x="445" y="335">und vorhandene Segmentanker</text><text class="small" x="445" y="357">Auffällige Antworten zurückgeben</text><rect class="node" x="810" y="255" width="285" height="126" rx="17"/><text x="830" y="287">Audit &amp; Verdichtung</text><text class="small" x="830" y="313">Stärkeres Modell</text><text class="small" x="830" y="335">Stichproben prüfen; Erfahrungen</text><text class="small" x="830" y="357">an Originalsegmenten bündeln</text><path class="flow" d="M336 317H419"/><path class="flow" d="M736 317H804"/><path class="return" d="M560 387V416H177V387"/><text class="meta review" x="202" y="440">Prüfrückmeldung → begrenzter neuer Versuch oder offener Prüffall</text><path class="flow" d="M950 387V464H576V494"/><rect class="node" x="810" y="500" width="285" height="105" rx="17"/><text x="830" y="532">Erfahrungsgrundlage</text><text class="small" x="830" y="558">Mastereinträge + Quellenbezug</text><text class="small" x="830" y="580">Profil- und Textgrundlagen</text><rect class="node" x="425" y="500" width="305" height="105" rx="17"/><text x="445" y="532">Globale Zusammenführung</text><text class="small" x="445" y="558">Cluster genau einmal zuordnen</text><text class="small" x="445" y="580">Zeit, Fälle und Referenzen erhalten</text><path class="flow" d="M736 550H804"/><rect class="node" x="25" y="500" width="305" height="105" rx="17"/><text x="45" y="532">Persönliche Korrektur</text><text class="small" x="45" y="558">Beitrag &amp; Bedeutung einordnen</text><text class="small" x="45" y="580">Aktuelle Angaben ergänzen</text><path class="return" d="M177 611V652H950V611"/><text class="meta review" x="259" y="681">Korrekturen in Wissensgrundlage und betroffene Ableitungen übernehmen</text><text class="small" x="25" y="720">Quellenreferenzen begleiten die Verarbeitung. Strukturprüfung allein beweist keine inhaltliche Richtigkeit.</text></svg>